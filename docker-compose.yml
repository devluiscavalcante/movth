name: movth

services:
  postgres:
    image: postgres:16
    container_name: movth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-movth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movth_password}
      POSTGRES_DB: ${POSTGRES_DB:-movth}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-movth} -d ${POSTGRES_DB:-movth}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: movth-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: movth-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://movth:movth_password@postgres:5432/movth?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-4000}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-movth_dev_access_key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-movth_dev_secret_key}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-movth-dev-media}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-https://cdn.example.com}
      TRANSCODE_QUEUE_NAME: ${TRANSCODE_QUEUE_NAME:-transcode}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: movth-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: movth-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://movth:movth_password@postgres:5432/movth?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TRANSCODE_QUEUE_NAME: ${TRANSCODE_QUEUE_NAME:-transcode}
      FFMPEG_THREADS: ${FFMPEG_THREADS:-2}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-movth_dev_access_key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-movth_dev_secret_key}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-movth-dev-media}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-https://cdn.example.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
